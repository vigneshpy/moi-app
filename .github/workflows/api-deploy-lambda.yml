name: Deploy API to AWS Lambda

on:
  push:
    branches: [master]
    paths:
      - "apps/api/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/api-deploy-lambda.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build api
        run: pnpm --filter moi-app-api run build

      - name: Create deployable bundle (production deps only)
        run: pnpm --filter moi-app-api deploy --prod --legacy /tmp/api-bundle

      - name: Zip Lambda package
        working-directory: /tmp/api-bundle
        run: zip -r /tmp/lambda.zip dist node_modules package.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name moi-app-lamda \
            --zip-file fileb:///tmp/lambda.zip
